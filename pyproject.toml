[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "stockmind"
version = "0.1.0"
description = "Asistente de inventario con IA que se conecta a cualquier ERP mediante MCP"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "mcp[cli]>=2.3,<3",
    "pydantic>=2.12",
    "pydantic-settings>=2.6",
    "pandas>=2.3",
    "numpy>=2.3",
    "openpyxl>=3.1",
]

[project.optional-dependencies]
dev = ["pytest>=8"]
# Para conectores opcionales que leen de MySQL
mysql = ["SQLAlchemy>=2.0", "PyMySQL>=1.1"]
# Backend del chat con IA (FastAPI) y proveedores de IA
api = ["fastapi>=0.115", "anthropic>=2.3", "google-genai>=2.30"]

[project.scripts]
stockmind-mcp = "stockmind.mcp_server.server:main"
stockmind-api = "stockmind.api.__main__:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
markers = [
    "integracion: usa la base de datos de un ERP real (solo lectura); se salta si no está configurada",
]
