[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "stockmind"
version = "0.1.0"
description = "Asistente de inventario con IA que se conecta a cualquier ERP mediante MCP"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "mcp[cli]>=2.3,<3",
    "pydantic>=2.12",
    "pydantic-settings>=2.6",
    "pandas>=2.3",
    "numpy>=2.3",
    "openpyxl>=3.1",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
stockmind-mcp = "stockmind.mcp_server.server:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
